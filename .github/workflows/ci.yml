name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node --check server.js && node --check app.js
      - name: Build image
        run: docker build -t video-chat-app:test .
      - name: Smoke test
        run: |
          docker run -d -p 3000:3000 video-chat-app:test
          sleep 5
          curl -f http://localhost:3000

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/video-chat-app:latest
            ${{ secrets.DOCKER_USERNAME }}/video-chat-app:${{ github.sha }}