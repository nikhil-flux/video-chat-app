name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node --check server.js && node --check app.js
      - name: Build image
        run: docker build -t video-chat-app:test .
      - name: Smoke test
        run: |
          docker run -d -p 3000:3000 video-chat-app:test
          sleep 5
          curl -f http://localhost:3000

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/video-chat-app:latest
            ${{ secrets.DOCKER_USERNAME }}/video-chat-app:${{ github.sha }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, aws]
    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/video-chat-app:latest

      - name: Restart app container
        run: |
          docker network create vc-net 2>/dev/null || true
          docker rm -f video-chat 2>/dev/null || true
          docker run -d --name video-chat --network vc-net --restart unless-stopped \
            ${{ secrets.DOCKER_USERNAME }}/video-chat-app:latest

      - name: Start Cloudflare tunnel (only if not already running)
        run: |
          if [ -z "$(docker ps -q -f name=^tunnel$)" ]; then
            docker rm -f tunnel 2>/dev/null || true
            docker run -d --name tunnel --network vc-net --restart unless-stopped \
              cloudflare/cloudflared:latest tunnel --no-autoupdate --url http://video-chat:3000
          fi

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' video-chat)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "--- health check log ---"
          docker inspect --format '{{json .State.Health}}' video-chat
          echo "--- app logs ---"
          docker logs video-chat
          exit 1

      - name: Find public URL
        run: |
          sleep 5
          docker logs tunnel 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1